name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "media/**"
      - "images/**"
      - "package.json"
      - "bun.lock"
      - ".vscodeignore"
      - "LICENSE"
      - "README.md"
      - "tsconfig.json"
      - "vitest.config.mts"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "media/**"
      - "images/**"
      - "package.json"
      - "bun.lock"
      - ".vscodeignore"
      - "LICENSE"
      - "README.md"
      - "tsconfig.json"
      - "vitest.config.mts"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check version against latest tag
        shell: bash
        run: |
          for field in name publisher displayName version main engines.vscode; do
            VALUE=$(jq -r ".${field} // empty | strings" package.json)
            if [ -z "$VALUE" ]; then
              echo "::error title=Invalid package.json::Missing required field: ${field}."
              exit 1
            fi
          done

          VERSION=$(jq -r .version package.json)
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$VERSION" =~ $SEMVER ]]; then
            echo "::error title=Invalid version::package.json version \"$VERSION\" must be MAJOR.MINOR.PATCH (no v prefix or pre-release suffix)."
            exit 1
          fi

          TAG="v$VERSION"
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E "^v${SEMVER#^}" | head -n 1 || true)

          if [ -n "$LATEST_TAG" ] && [ "$TAG" != "$LATEST_TAG" ] \
            && [ "$(printf '%s\n%s\n' "$VERSION" "${LATEST_TAG#v}" | sort -V | head -n 1)" = "$VERSION" ]; then
            echo "::error title=Version too low::package.json version $VERSION is lower than latest tag $LATEST_TAG."
            exit 1
          fi
          echo "package.json $VERSION, latest tag ${LATEST_TAG:-none}."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: ./node_modules/.bin/prettier --check "**/*.{ts,tsx,json,md}"

      - name: Typecheck (no emit)
        run: bun run lint

      - name: Compile
        run: bun run compile

      - name: Test
        run: bun run test

      - name: Package VSIX (validation only)
        run: bun run package

      - name: Validate VSIX contents
        shell: bash
        run: |
          VSIX=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          if [ -z "$VSIX" ]; then
            echo "::error title=No VSIX::bun run package produced no .vsix file."
            exit 1
          fi
          for required in extension/package.json extension/out/extension.js extension/media/faah.wav; do
            if ! unzip -l "$VSIX" "$required" >/dev/null 2>&1; then
              echo "::error title=Missing file in VSIX::$required is not packaged. Check .vscodeignore."
              exit 1
            fi
          done
          if unzip -l "$VSIX" | grep -E 'extension/(src|tests|\.github)/' >/dev/null; then
            echo "::error title=Dev files in VSIX::Source or tests were packaged. Check .vscodeignore."
            exit 1
          fi
